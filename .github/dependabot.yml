version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Type definitions must describe the Node we actually run, which is 22 in CI, in
      # fiber.yml, and in the web image. A newer major would type-check calls the runtime
      # does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Every `uses:` in both workflows is pinned to a commit SHA with the tag in a trailing
  # comment. This is what moves the SHA and the comment together — without it the pins
  # freeze and we stop getting security fixes for the actions themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly

  # apps/ui/Dockerfile.ui was outside every ecosystem, so `node:22-alpine` and
  # `nginx:alpine` in the image serving the UI were the only base images nothing watched.
  - package-ecosystem: docker
    directory: /apps/ui
    schedule:
      interval: monthly
