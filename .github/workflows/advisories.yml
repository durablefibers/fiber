name: advisories

# `deny` in ci.yml only runs when someone pushes. An advisory published against a crate
# already in Cargo.lock changes nothing in the repository, so between pushes it went
# unseen: by November 2026 main had collected seven RUSTSEC advisories. This runs
# the advisory check on main every day so a new one fails a run without waiting for a PR.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
