name: release

# Tag a release: `git tag v0.2.0 && git push origin v0.2.0`.
# Publishes container images to GHCR and agent/CLI binaries to the GitHub release.
#
# The web image is deliberately not published: its API URL is baked in at build time,
# so a generic image would only work for whoever's URL was compiled in. Build it per
# deployment (see docs/operations.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true

# Read-only by default; `images`, `manifest` and `publish` each widen it themselves to
# exactly what they push. Without this, a job that forgets to declare `permissions:`
# inherits whatever the repository default is — which for a workflow that pushes GHCR
# images and release binaries is the wrong way round.
permissions:
  contents: read

# Serialise per tag, and never cancel: a half-published release (images pushed, binaries
# not) is worse than a queued one, so `cancel-in-progress` is deliberately false. The
# group is the ref so a `workflow_dispatch` re-publish of the same tag queues behind the
# original instead of racing it.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Build records are a debugging aid we do not use, and they were ending up attached to
  # releases as `.dockerbuild` files.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  # A tag can point at a commit that never went through `main`, so re-run the gate here
  # rather than trusting that CI saw it.
  verify:
    runs-on: ubuntu-24.04
    # Inherits the workflow's `contents: read`; it only checks out and builds.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: tag matches the workspace version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version (Cargo.toml)" >&2
            exit 1
          fi

      # The same `make check` as .github/workflows/ci.yml and as a contributor's shell.
      # This job used to run a third variant of clippy (no --all-targets, no --locked),
      # so a tag could publish code that `make check` would have rejected.
      - run: make check
      - run: make test-rust

  # One native runner per architecture: a Rust build under QEMU is far too slow. Each
  # job pushes an untagged image by digest; `manifest` below joins them into one tag.
  images:
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [fiber-api, fiber-agent]
        arch: [amd64, arm64]
        # Keyed on `arch`, so each entry merges into the two combinations that share it
        # rather than adding a job of its own. Four jobs: each image on each runner.
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.name }}
          platforms: ${{ matrix.platform }}
          # No tags here: a tag pushed by two jobs would leave whichever finished last
          # as the whole image. Push by digest and let `manifest` assemble them.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags live here, applied once to a manifest list covering both architectures.
  manifest:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [fiber-api, fiber-agent]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # Explicit source so a workflow_dispatch re-publish tags the same versions a
          # tag push would (github.ref would otherwise be a branch and match nothing).
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}

      - name: create and push the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
        run: |
          set -euo pipefail
          refs=""
          for digest in *; do
            [ -e "$digest" ] || { echo "no digests downloaded for $IMAGE" >&2; exit 1; }
            refs="$refs ${IMAGE}@sha256:${digest}"
          done
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          # Print the platforms so a regression to a single architecture is visible in
          # the log rather than only to whoever tries to pull it.
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # Inherits the workflow's `contents: read`. Uploading a workflow artifact does not use
  # GITHUB_TOKEN, so nothing here needs write anywhere.
  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc wins: the binary has to run on hosts older than the
          # runner (Debian bookworm is glibc 2.36).
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p fiber-agent -p fiber-cli

      - name: runs on an older distro than the runner
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b:ro" \
            debian:bookworm-slim /b/fiber-agent --version

      - name: package
        run: |
          set -euo pipefail
          out="fiber-agent-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$out" fiber-agent fiber
          if command -v sha256sum >/dev/null; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Prefixed so `publish` can ask for exactly these. It downloaded everything
          # before, which swept in the build records the image jobs upload — whether they
          # appeared depended on which job finished first, so a release sometimes carried
          # four stray `.dockerbuild` files and sometimes did not.
          name: binaries-${{ matrix.target }}
          path: |
            fiber-agent-${{ matrix.target }}.tar.gz
            fiber-agent-${{ matrix.target }}.tar.gz.sha256

  # One publisher: three matrix jobs racing to create the same release is not safe.
  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: only the release assets, nothing else
        run: |
          set -euo pipefail
          ls -l dist
          # A zero-length asset is what made the last publish fail outright, and an empty
          # dist would silently publish a release with no binaries at all.
          [ -n "$(ls -A dist)" ] || { echo "no binaries downloaded" >&2; exit 1; }
          find dist -type f -empty -print -exec false {} + || {
            echo "refusing to publish an empty asset" >&2; exit 1; }

      # The release notes are this version's CHANGELOG section, not the whole file.
      - name: release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\].*?(?=^## \[|\Z)",
              re.M | re.S,
          )
          m = pattern.search(text)
          if m:
              body = m.group(0).strip()
              # Drop the section heading; the release page already shows the version.
              body = body.split("\n", 1)[1].strip()
          else:
              print(f"::warning::no CHANGELOG section for {version}; using the whole file")
              body = text.strip()
          repo = os.environ["REPO"]
          body += f"\n\n---\n\nFull changelog: https://github.com/{repo}/blob/{tag}/CHANGELOG.md"
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n")
          EOF

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
