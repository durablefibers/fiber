# Narrowing which project secrets a step receives.
#
# By default every step gets every project secret. Naming them keeps credentials out of
# steps that have no use for them — which matters most for a step running an image you
# do not control. Secret values are masked as *** in step logs either way.
name: scoped-secrets
steps:
  build:
    run: |
      echo "no secrets needed here"
      mkdir -p out && echo "1.0.0" > out/VERSION
    labels: [os=linux]
    artifacts: [out/VERSION]
    secrets: []                 # none

  scan:
    needs: [build]
    run: echo "scanning $(cat out/VERSION) with a third-party image"
    image: alpine:3
    labels: [os=linux]
    secrets: []                 # a third-party image sees no credentials

  publish:
    needs: [build]
    run: echo "publishing $(cat out/VERSION)"   # would use $NPM_TOKEN
    labels: [os=linux]
    secrets: [NPM_TOKEN]        # only this one
    timeout_minutes: 10
