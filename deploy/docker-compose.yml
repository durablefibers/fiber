name: fiber
services:
  fiber-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fiber
      POSTGRES_PASSWORD: fiber
      POSTGRES_DB: fiber
    ports:
      - "15432:5432"
    volumes:
      - fiber_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiber -d fiber"]
      interval: 5s
      timeout: 5s
      retries: 10

  fiber-redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fiber-minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fiber
      MINIO_ROOT_PASSWORD: fiberfiber
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - fiber_minio:/data

  fiber-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      FIBER_DATABASE_URL: postgres://fiber:fiber@fiber-postgres:5432/fiber
      FIBER_REDIS_URL: redis://fiber-redis:6379
      FIBER_LISTEN: 0.0.0.0:8080
      FIBER_ARTIFACTS_DIR: /data/artifacts
      FIBER_S3_BUCKET: fiber-artifacts
      FIBER_S3_ENDPOINT: http://fiber-minio:9000
      FIBER_S3_PUBLIC_ENDPOINT: http://127.0.0.1:19000
      FIBER_S3_ACCESS_KEY: fiber
      FIBER_S3_SECRET_KEY: fiberfiber
      FIBER_S3_REGION: us-east-1
      # Dev-only sample key (32 bytes hex). Override in production.
      FIBER_SECRETS_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RUST_LOG: info,fiber_api=info
    ports:
      - "18080:8080"
    volumes:
      - fiber_artifacts:/data/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      fiber-postgres:
        condition: service_healthy
      fiber-redis:
        condition: service_healthy
      fiber-minio:
        condition: service_started

  fiber-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.web
      args:
        VITE_FIBER_API_URL: http://localhost:18080
    ports:
      - "3100:80"
    depends_on:
      - fiber-api
volumes:
  fiber_pg:
  fiber_artifacts:
  fiber_minio:
