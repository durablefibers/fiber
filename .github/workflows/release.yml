name: release

# Tag a release: `git tag v0.2.0 && git push origin v0.2.0`.
# Publishes container images to GHCR and agent/CLI binaries to the GitHub release.
#
# The web image is deliberately not published: its API URL is baked in at build time,
# so a generic image would only work for whoever's URL was compiled in. Build it per
# deployment (see docs/operations.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  # A tag can point at a commit that never went through `main`, so re-run the gate here
  # rather than trusting that CI saw it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: tag matches the workspace version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version (Cargo.toml)" >&2
            exit 1
          fi

      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [fiber-api, fiber-agent]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # Explicit source so a workflow_dispatch re-publish tags the same versions a
          # tag push would (github.ref would otherwise be a branch and match nothing).
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc wins: the binary has to run on hosts older than the
          # runner (Debian bookworm is glibc 2.36).
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p fiber-agent -p fiber-cli

      - name: runs on an older distro than the runner
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b:ro" \
            debian:bookworm-slim /b/fiber-agent --version

      - name: package
        run: |
          set -euo pipefail
          out="fiber-agent-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$out" fiber-agent fiber
          if command -v sha256sum >/dev/null; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            fiber-agent-${{ matrix.target }}.tar.gz
            fiber-agent-${{ matrix.target }}.tar.gz.sha256

  # One publisher: three matrix jobs racing to create the same release is not safe.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
