server {
    # 8080, not 80: the image is nginxinc/nginx-unprivileged and runs as uid 101,
    # which cannot bind a privileged port. Compose publishes host 3100 onto it.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
